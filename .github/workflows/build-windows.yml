name: build-windows-sdl

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
            mingw-w64-x86_64-lua
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-libepoxy

      - name: Configure
        shell: msys2 {0}
        run: |
          set +e
          cmake -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/mingw64 \
            -DENABLE_SCRIPTING=ON \
            -DUSE_LUA=ON \
            -DUSE_QT=OFF \
            -DUSE_SDL=ON \
            -DUSE_EDITLINE=OFF \
            -S . -B build 2>&1 | tee configure.log
          echo "exit=${PIPESTATUS[0]}" | tee -a configure.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: configure-log
          path: configure.log
          retention-days: 7

      - name: Build
        shell: msys2 {0}
        run: |
          set -o pipefail
          cmake --build build -j4 2>&1 | tee build.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Collect and smoke-test
        if: success()
        shell: msys2 {0}
        run: |
          set +e
          EXE=$(find build -name "mgba-sdl*.exe" -type f | head -1)
          echo "found exe: [$EXE]"
          mkdir -p dist
          if [ -z "$EXE" ]; then
            echo "EXE NOT FOUND" | tee smoke.txt
            ls -R build | head -50 >> smoke.txt
          else
            cp "$EXE" dist/
            # libmgba is a build output, not a system library
            find build -name "libmgba*.dll" -exec cp {} dist/ \; 2>/dev/null
            for d in libgcc_s_seh-1 libstdc++-6 libwinpthread-1 zlib1 SDL2 libpng16-16; do
              cp "/mingw64/bin/$d.dll" dist/ 2>/dev/null || echo "missing $d.dll" >> smoke.txt
            done
            ls -la >> smoke.txt
            cd dist
            ./mgba-sdl.exe --help > smoke.txt 2>&1
            echo "exit=$?" >> smoke.txt
          fi
          cat smoke.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mgba-sdl-windows
          path: |
            dist/
            smoke.txt
          retention-days: 30