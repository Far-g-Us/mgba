name: build-windows-sdl

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Refresh package database
        run: pacman -Sy --noconfirm

      - name: Install dependencies
        run: |
          pacman -S --noconfirm --needed mingw-w64-x86_64-gcc
          pacman -S --noconfirm --needed mingw-w64-x86_64-cmake
          pacman -S --noconfirm --needed mingw-w64-x86_64-lua
          pacman -S --noconfirm --needed mingw-w64-x86_64-SDL2
          pacman -S --noconfirm --needed mingw-w64-x86_64-libpng
          pacman -S --noconfirm --needed mingw-w64-x86_64-zlib
          pacman -S --noconfirm --needed mingw-w64-x86_64-freetype
          pacman -S --noconfirm --needed mingw-w64-x86_64-libepoxy

      - name: Configure
        run: |
          export PATH=/mingw64/bin:$PATH
          cmake -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/mingw64 \
            -DENABLE_SCRIPTING=ON \
            -DUSE_LUA=ON \
            -DUSE_QT=OFF \
            -DUSE_SDL=ON \
            -DUSE_EDITLINE=OFF \
            -S . -B build

      - name: Build
        run: |
          export PATH=/mingw64/bin:$PATH
          cmake --build build -j$(nproc)

      - name: Collect runtime
        run: |
          mkdir -p dist
          cp build/mgba-sdl.exe dist/
          for d in libgcc_s_seh-1 libstdc++-6 libwinpthread-1 zlib1 SDL2 libpng16-16; do
            cp "/mingw64/bin/$d.dll" dist/ 2>/dev/null || echo "::warning::missing $d.dll"
          done

      - name: Verify scripting is compiled in
        run: |
          ./dist/mgba-sdl.exe --help | tee help.txt
          grep -qi script help.txt || echo "::warning::no script option listed in --help"

      - uses: actions/upload-artifact@v4
        with:
          name: mgba-sdl-windows
          path: dist/
          retention-days: 30